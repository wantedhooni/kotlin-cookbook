server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: order_svc
  flyway:
    schemas: order_svc
    create-schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

services:
  balance:
    base-url: ${BALANCE_SERVICE_URL:http://localhost:8083}
  account:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8085}
management:
  metrics:
    tags:
      application: order-service
  endpoints.web.exposure.include: health,info,prometheus
