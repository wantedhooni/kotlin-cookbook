services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    command: >
      postgres 
      -c log_statement=all 
      -c log_destination=stderr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg-settlement-data:/var/lib/postgresql/data
volumes:
  pg-settlement-data:
