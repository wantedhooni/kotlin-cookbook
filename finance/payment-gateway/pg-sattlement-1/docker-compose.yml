services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-pension}
      POSTGRES_USER: ${DB_USERNAME:-pension}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pension-local}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pension} -d ${DB_NAME:-pension}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0
    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

