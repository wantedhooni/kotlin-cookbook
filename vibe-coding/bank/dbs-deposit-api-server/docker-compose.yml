services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dbs_deposit
      POSTGRES_USER: dbs
      POSTGRES_PASSWORD: dbs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbs -d dbs_deposit"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbs-deposit-postgres:/var/lib/postgresql/data

volumes:
  dbs-deposit-postgres:
