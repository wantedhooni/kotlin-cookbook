server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:dbsdeposit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

dbs:
  mode: ${DBS_MODE:mock}
  base-url: ${DBS_BASE_URL:https://www.dbs.com/sandbox}
  client-id: ${DBS_CLIENT_ID:}
  access-token: ${DBS_ACCESS_TOKEN:}
  accept-version: ${DBS_ACCEPT_VERSION:application/json;v=1.0}
  paths:
    list-deposits: ${DBS_LIST_DEPOSITS_PATH:/api/sg/v1/parties/{partyId}/deposits}
    deposit-detail: ${DBS_DEPOSIT_DETAIL_PATH:/api/sg/v1/deposits/{accountId}}
  http:
    connect-timeout: ${DBS_CONNECT_TIMEOUT:3s}
    read-timeout: ${DBS_READ_TIMEOUT:5s}
  mock-delay: ${DBS_MOCK_DELAY:0s}

app:
  sync:
    lease-duration: ${SYNC_LEASE_DURATION:30s}
  idempotency:
    retention: ${IDEMPOTENCY_RETENTION:24h}
    processing-timeout: ${IDEMPOTENCY_PROCESSING_TIMEOUT:1m}
