spring:
  application:
    name: trs-refund-service
  datasource:
    url: jdbc:h2:mem:trs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop # demo only; use Flyway in production
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
