openapi: 3.0.3
info:
  title: 계정 관리 Admin API
  version: 0.1.0
  description: 개발용 초기 관리자 HTTP Basic 인증을 사용합니다. 관리 대상 계정 데이터는 실제 로그인 인증 주체가 아닙니다.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
paths:
  /api/admin/accounts:
    get:
      summary: 계정 목록 검색 및 페이지 조회
      operationId: searchAccounts
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/AccountRole'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AccountStatus'}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 검색 결과입니다. 상태를 명시하지 않으면 DELETED 계정은 제외합니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: 관리자 인증이 필요함}
    post:
      summary: 새 계정 생성
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccount'}
      responses:
        '201':
          description: 계정 생성 완료
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: 관리자 인증이 필요함}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/admin/accounts/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 계정 상세 조회
      operationId: getAccount
      responses:
        '200':
          description: 계정 상세 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '401': {description: 관리자 인증이 필요함}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: 계정 이메일 및 표시 이름 수정
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAccount'}
      responses:
        '200':
          description: 계정 정보 변경 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: 계정 논리 삭제
      operationId: softDeleteAccount
      responses:
        '204': {description: 계정이 논리 삭제됨}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounts/{id}/role:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: 계정 역할 변경
      operationId: changeAccountRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: '#/components/schemas/AccountRole'}
      responses:
        '200':
          description: 계정 정보 변경 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounts/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: 계정 상태 변경
      operationId: changeAccountStatus
      description: ACTIVE 또는 SUSPENDED만 지정할 수 있습니다. DELETED 처리는 DELETE API를 사용합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/AccountStatus'}
      responses:
        '200':
          description: 계정 정보 변경 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    basicAuth: {type: http, scheme: basic}
  schemas:
    AccountRole: {type: string, enum: [USER, ADMIN]}
    AccountStatus: {type: string, enum: [ACTIVE, SUSPENDED, DELETED]}
    CreateAccount:
      type: object
      required: [loginId, email, displayName]
      properties:
        loginId: {type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9._-]{3,50}$'}
        email: {type: string, format: email, maxLength: 255}
        displayName: {type: string, minLength: 1, maxLength: 100}
        role: {$ref: '#/components/schemas/AccountRole'}
    UpdateAccount:
      type: object
      required: [email, displayName]
      properties:
        email: {type: string, format: email, maxLength: 255}
        displayName: {type: string, minLength: 1, maxLength: 100}
    Account:
      type: object
      required: [id, loginId, email, displayName, role, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        loginId: {type: string}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {$ref: '#/components/schemas/AccountRole'}
        status: {$ref: '#/components/schemas/AccountStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AccountPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Account'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    ApiError:
      type: object
      required: [timestamp, status, code, message, path]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        code: {type: string}
        message: {type: string}
        path: {type: string}
  responses:
    BadRequest:
      description: 요청 값이 잘못됨
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: 계정이 존재하지 않거나 삭제되었음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: 로그인 ID 또는 이메일이 중복됨
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
