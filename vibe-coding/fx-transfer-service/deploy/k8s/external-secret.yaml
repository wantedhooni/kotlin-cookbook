# Requires External Secrets Operator and ClusterSecretStore/aws-secretsmanager (provided by platform).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fx-transfer-secrets
  namespace: fx-transfer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: fx-transfer-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: fx-transfer/production, property: DB_PASSWORD }
    - secretKey: BANK_API_KEY
      remoteRef: { key: fx-transfer/production, property: BANK_API_KEY }
    - secretKey: FX_PROVIDER_API_KEY
      remoteRef: { key: fx-transfer/production, property: FX_PROVIDER_API_KEY }
