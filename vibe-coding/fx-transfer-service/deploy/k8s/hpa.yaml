apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fx-transfer-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fx-transfer-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
