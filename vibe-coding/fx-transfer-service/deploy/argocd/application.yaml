apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fx-transfer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_REPO.git
    targetRevision: REPLACE_WITH_IMMUTABLE_GIT_SHA
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fx-transfer
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
